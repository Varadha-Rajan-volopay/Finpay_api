---
openapi: 3.0.1
info:
  title: FinpayAPI
  version: v1
  description: Version 1 of the Finpay expense management API.
servers:
- url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items: {}
          required:
          - code
          - message
          - details
      required:
      - error
  Expense:
    type: object
    properties:
      id:
        type: integer
      user_id:
        type: integer
      category_id:
        type: integer
      title:
        type: string
      amount_cents:
        type: integer
      currency:
        type: string
        example: INR
      status:
        type: string
        enum:
        - pending
        - approved
        - rejected
        - reimbursed
        - archived
      incurred_on:
        type: string
        format: date
      reference_number:
        type: string
        nullable: true
      reimbursed_at:
        type: string
        format: date-time
        nullable: true
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
      amount_display:
        type: string
        example: '2500.00'
      category_name:
        type: string
security:
- bearerAuth: []
paths:
  "/api/v1/auth/login":
    post:
      summary: Login
      tags:
      - Authentication
      operationId: login
      security: []
      parameters: []
      responses:
        '401':
          description: Invalid company or credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - company
              - user
              properties:
                company:
                  type: object
                  required:
                  - subdomain
                  properties:
                    subdomain:
                      type: string
                      example: acme
                user:
                  type: object
                  required:
                  - email
                  - password
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      format: password
        required: true
  "/api/v1/auth/logout":
    delete:
      summary: Logout
      tags:
      - Authentication
      operationId: logout
      security:
      - bearerAuth: []
      responses:
        '401':
          description: Missing or invalid token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v1/auth/register":
    post:
      summary: Register a company and its admin user
      tags:
      - Authentication
      operationId: register
      security: []
      parameters: []
      responses:
        '201':
          description: Company and admin user registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  company:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      subdomain:
                        type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      role:
                        type: string
        '422':
          description: Invalid registration data
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - company
              - user
              properties:
                company:
                  type: object
                  required:
                  - name
                  - subdomain
                  properties:
                    name:
                      type: string
                      example: Finpay Test Company
                    subdomain:
                      type: string
                      example: finpaytest
                user:
                  type: object
                  required:
                  - email
                  - password
                  - password_confirmation
                  properties:
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      format: password
                    password_confirmation:
                      type: string
                      format: password
        required: true
  "/api/v1/auth/refresh":
    post:
      summary: Refresh access and refresh tokens
      tags:
      - Authentication
      operationId: refreshToken
      security: []
      parameters: []
      responses:
        '401':
          description: Invalid, expired, or revoked refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
        required: true
  "/api/v1/auth/me":
    get:
      summary: Get the authenticated user
      tags:
      - Authentication
      operationId: currentUser
      security:
      - bearerAuth: []
      responses:
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/expenses":
    get:
      summary: List expenses
      tags:
      - Expenses
      operationId: listExpenses
      security:
      - bearerAuth: []
      parameters:
      - name: category_id
        in: query
        required: false
        schema:
          type: integer
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        format: date
        required: false
        schema:
          type: string
      - name: to
        in: query
        format: date
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per
        in: query
        required: false
        description: Results per page. Default 20, maximum 100.
        schema:
          type: integer
      - name: pagination
        in: query
        required: false
        enum:
        - offset
        - keyset
        schema:
          type: string
        description: ":\n * `offset` \n * `keyset` \n "
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    post:
      summary: Create an expense
      tags:
      - Expenses
      operationId: createExpense
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - expense
              properties:
                expense:
                  type: object
                  required:
                  - title
                  - category_id
                  - amount_cents
                  - currency
                  - incurred_on
                  properties:
                    title:
                      type: string
                    category_id:
                      type: integer
                    amount_cents:
                      type: integer
                      minimum: 1
                    currency:
                      type: string
                      example: INR
                    incurred_on:
                      type: string
                      format: date
                    notes:
                      type: string
        required: true
  "/api/v1/expenses/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Get an expense
      tags:
      - Expenses
      operationId: getExpense
      security:
      - bearerAuth: []
      responses:
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
    patch:
      summary: Update an expense
      tags:
      - Expenses
      operationId: updateExpense
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - expense
              properties:
                expense:
                  type: object
                  properties:
                    title:
                      type: string
                    category_id:
                      type: integer
                    amount_cents:
                      type: integer
                      minimum: 1
                    currency:
                      type: string
                    incurred_on:
                      type: string
                      format: date
                    notes:
                      type: string
        required: true
    put:
      summary: Update an expense using PUT
      tags:
      - Expenses
      operationId: replaceExpense
      security:
      - bearerAuth: []
      parameters: []
      responses:
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - expense
              properties:
                expense:
                  type: object
                  properties:
                    title:
                      type: string
                    category_id:
                      type: integer
                    amount_cents:
                      type: integer
                    currency:
                      type: string
                    incurred_on:
                      type: string
                      format: date
                    notes:
                      type: string
        required: true
    delete:
      summary: Delete an expense
      tags:
      - Expenses
      operationId: deleteExpense
      security:
      - bearerAuth: []
      responses:
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/expenses/{id}/approve":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    - name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    post:
      summary: Approve an expense
      tags:
      - Expense Workflow
      operationId: approveExpense
      security:
      - bearerAuth: []
      responses:
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/expenses/{id}/reject":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    - name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
    post:
      summary: Reject an expense
      tags:
      - Expense Workflow
      operationId: rejectExpense
      security:
      - bearerAuth: []
      responses:
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/expenses/{id}/reimburse":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    - name: Idempotency-Key
      in: header
      required: true
      description: Unique key used to make reimbursement requests repeat-safe.
      schema:
        type: string
    post:
      summary: Reimburse an expense
      tags:
      - Expense Workflow
      operationId: reimburseExpense
      security:
      - bearerAuth: []
      responses:
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
  "/api/v1/expenses/{id}/archive":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Archive an expense
      tags:
      - Expense Workflow
      operationId: archiveExpense
      security:
      - bearerAuth: []
      responses:
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
