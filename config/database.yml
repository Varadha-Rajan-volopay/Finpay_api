default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", "5433") %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "postgres") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: finpay_api_development

test:
  <<: *default
  database: finpay_api_test

production:
  primary: &primary_production
    adapter: postgresql
    encoding: unicode
    host: <%= ENV["DATABASE_HOST"] %>
    port: <%= ENV.fetch("DATABASE_PORT", "5432") %>
    database: finpay_api_production
    username: finpay_api
    password: <%= ENV["FINPAY_API_DATABASE_PASSWORD"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  cache:
    <<: *primary_production
    database: finpay_api_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: finpay_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: finpay_api_production_cable
    migrations_paths: db/cable_migrate